<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Lab</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #0F0F14;
    color: #F5F5F5;
    min-height: 100vh;
    overflow-x: hidden;
}

.background {
    position: fixed;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, #00F5FF, #8A2BE2, #FF2E88);
    background-size: 300% 300%;
    animation: gradientMove 15s infinite alternate;
    opacity: 0.05;
    z-index: -1;
}

@keyframes gradientMove {
    0% {background-position: left;}
    100% {background-position: right;}
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
    padding: 40px 0;
}

h1 {
    font-size: 3rem;
    text-align: center;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00F5FF, #8A2BE2, #FF2E88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    text-align: center;
    color: #A0A0B5;
    margin-bottom: 40px;
}

.card {
    background: rgba(26, 26, 36, 0.8);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(138, 43, 226, 0.2);
    margin-bottom: 30px;
    transition: transform 0.3s ease;

    transform: scale(1.05);
}

.card:hover {
    transform: scale(1.1);
}

.upload-box {
    border: 2px dashed #8A2BE2;
    padding: 10px;
    text-align: center;
    border-radius: 15px;
    transition: 0.3s;
    cursor: pointer;

    
}

.upload-box:hover {
    border-color: #00F5FF;
    box-shadow: 0 0 15px #00F5FF;
}

input[type="file"] {
    display: none;
}

.toggle-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

.toggle-btn {
    padding: 12px 30px;
    border-radius: 50px;
    border: 2px solid #8A2BE2;
    cursor: pointer;
    transition: 0.3s;
}

.toggle-btn.active {
    background: linear-gradient(90deg, #00F5FF, #8A2BE2);
    box-shadow: 0 0 15px #8A2BE2;
}

.toggle-btn:hover {
    transform: scale(1.05);
}

.convert-btn {
    display: block;
    margin: 30px auto 0;
    padding: 14px 40px;
    border-radius: 50px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    background: linear-gradient(90deg, #00F5FF, #8A2BE2, #FF2E88);
    color: white;
    transition: 0.3s;
}

.convert-btn:hover {
    box-shadow: 0 0 20px #FF2E88;
    transform: scale(1.05);
}

.output {
    display: none;
    animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.binary-box {
    font-family: 'JetBrains Mono', monospace;
    background: #111118;
    padding: 20px;
    border-radius: 10px;
    overflow-x: auto;
    border: 1px solid #00F5FF;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.stat-card {
    background: #1A1A24;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    border: 1px solid #8A2BE2;
}

.stat-card h2 {
    font-size: 1.5rem;
    color: #00F5FF;
}

@media(max-width:768px){
    h1 {font-size: 2rem;}
}
</style>
</head>

<body>

<div class="background"></div>

<div class="container">
    <h1>Binary Lab</h1>
    <p class="subtitle">Convert Text Files into 32-bit or 64-bit Memory Blocks</p>

    <div class="card">
        <label class="upload-box" for="fileUpload">
            Click here to Upload File
        </label>
        <input type="file" id="fileUpload">

        <div class="toggle-container">
            <div class="toggle-btn active" onclick="selectMode(32)" id="btn32">32-BIT</div>
            <div class="toggle-btn" onclick="selectMode(64)" id="btn64">64-BIT</div>
        </div>

        <button class="convert-btn" onclick="convert()">Convert</button>
    </div>

    <div class="card output" id="outputSection">
        <h2>Binary Output</h2>
        <div class="binary-box" id="binaryOutput"></div>

        <div class="stats">
            <div class="stat-card">
                <h2 id="charCount">0</h2>
                <p>Characters</p>
            </div>
            <div class="stat-card">
                <h2 id="bitCount">0</h2>
                <p>Total Bits</p>
            </div>
            <div class="stat-card">
                <h2 id="blockCount">0</h2>
                <p>Memory Blocks</p>
            </div>
            <div class="stat-card">
                <h2 id="archType">32</h2>
                <p>Architecture</p>
            </div>
        </div>
    </div>
</div>

<script>
let selectedMode = 32;

function selectMode(mode){
    selectedMode = mode;
    document.getElementById("btn32").classList.remove("active");
    document.getElementById("btn64").classList.remove("active");
    document.getElementById("btn" + mode).classList.add("active");
}

function convert(){
    const sampleText = "Hello World";
    let binary = "";

    for(let i=0; i<sampleText.length; i++){
        binary += sampleText.charCodeAt(i).toString(2).padStart(8,"0");
    }

    let blocks = [];
    for(let i=0; i<binary.length; i+=selectedMode){
        blocks.push(binary.slice(i, i+selectedMode).padEnd(selectedMode,"0"));
    }

    document.getElementById("binaryOutput").innerHTML = blocks.join("<br><br>");
    document.getElementById("charCount").innerText = sampleText.length;
    document.getElementById("bitCount").innerText = binary.length;
    document.getElementById("blockCount").innerText = blocks.length;
    document.getElementById("archType").innerText = selectedMode;

    document.getElementById("outputSection").style.display = "block";
}
</script>

</body>
</html>
